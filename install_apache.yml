---

- name: Apache Playbook
  hosts: all
  # Automatically elevate privileges
  become: true
  # Actions to be performed
  tasks:

    - name: Update repository index
      ansible.builtin.apt:
        update_cache: true

    - name: Install apache2 package
      ansible.builtin.apt:
        name: apache2
        # Setting version
        state: latest

    - name: Add php support for apache
      ansible.builtin.apt:
        name: libapache2-mod-php
        state: latest
