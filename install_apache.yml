---

- name: Apache Playbook
  hosts: all
  # Automatically elevate privileges
  become: true
  # Actions to be performed
  tasks:

    - name: Update repo index & install apache/php package
      # Universal keyword to automatically identify the distro package manager
      ansible.builtin.package:
        name:
          # Multiple task may be merged into a single one when sharing similar implementation
          - "{{ apache_package }}"
          - "{{ php_package }}"
        # Setting version
        state: latest
        # Deprecated previous repository task in favor of cache updating
        update_cache: true
      # Conditional execution based on multiple conditions
      # when: ansible_distribution in ["Debian", "Ubuntu"]
      # when: ansible_distribution == "Ubuntu" and ansible_distribution_version == "26.04"
