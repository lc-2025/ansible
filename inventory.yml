all:
  vars:
    ansible_user: "ubuntu"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
    ansible_ssh_private_key_file: "/home/vscode/.ssh/id_rsa"
    apache_package: apache2
    php_package: libapache2-mod-php
  children:
    nodes:
      hosts:
        node1:
          ansible_host: "10.97.0.170"
        node2:
          ansible_host: "10.97.0.142"
        node3:
          ansible_host: "10.97.0.195"
